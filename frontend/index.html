<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Football Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="logo">⚽</span>
    <h1>Football Schedule</h1>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('matches')">Matches</button>
      <button class="tab" onclick="showTab('standings')">Standings</button>
      <button class="tab" onclick="showTab('manage')">Manage</button>
    </div>

    <!-- MATCHES -->
    <div class="section active" id="matches">
      <div id="matchList"></div>
    </div>

    <!-- STANDINGS -->
    <div class="section" id="standings">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Team</th>
            <th>P</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GF</th>
            <th>GA</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>

    <!-- MANAGE -->
    <div class="section" id="manage">
      <div class="card form-card">
        <h3>Add Team</h3>
        <div class="form-row">
          <input id="teamName" placeholder="Team name" />
          <button onclick="addTeam()">Add</button>
        </div>
      </div>

      <div class="card form-card">
        <h3>Schedule Match</h3>
        <div class="form-row">
          <select id="homeTeam"></select>
          <span class="vs">vs</span>
          <select id="awayTeam"></select>
          <input type="datetime-local" id="matchDate" />
          <button onclick="addMatch()">Add</button>
        </div>
      </div>

      <div class="card form-card">
        <h3>Update Result</h3>
        <div class="form-row">
          <select id="matchSelect"></select>
          <input id="homeScore" placeholder="Home" type="number" min="0" />
          <span class="vs">:</span>
          <input id="awayScore" placeholder="Away" type="number" min="0" />
          <button class="btn-green" onclick="updateResult()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
