services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user1:password@db:5432/sportsdb
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sportsdb
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

